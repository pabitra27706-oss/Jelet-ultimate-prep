<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" width="400" height="680" role="img" aria-labelledby="title desc"><title id="title">A Field Notebook</title><desc id="desc">Design study, not a live page. Reading-first practice with a labelled circuit and a notebook task. Positive nine volt and zero volt terminals span both resistors.</desc><rect x="0" y="0" width="400" height="680" rx="0" fill="#fbf6e9"/><rect x="0" y="0" width="400" height="6" rx="0" fill="#9d381f"/><text x="24" y="43" fill="#9d381f" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1">JELET   /   FIELD NOTES</text><text x="304" y="43" fill="#1b322e" font-family="system-ui,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Learn   ≡</text><rect x="24" y="62" width="352" height="1" rx="0" fill="#cabfa7"/><text x="24" y="95" fill="#53625c" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">ELECTRICAL   /   ORIGINAL PRACTICE</text><text x="23" y="150" fill="#1b322e" font-family="Georgia,serif" font-size="46" font-weight="400" letter-spacing="0">Which branch</text><text x="23" y="198" fill="#1b322e" font-family="Georgia,serif" font-size="44" font-weight="400" letter-spacing="0">keeps its current?</text><text x="24" y="231" fill="#1b322e" font-family="system-ui,sans-serif" font-size="17" font-weight="400" letter-spacing="0">An ideal 9 V source. Two parallel paths.</text><rect x="24" y="253" width="352" height="177" rx="10" fill="#eaeede"/><text x="40" y="278" fill="#334e45" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0">FIG. 01   /   BOTH BRANCHES CLOSED</text><g transform="translate(0 292)" fill="none" stroke="#234d40" stroke-width="2.5" stroke-linejoin="round"><path d="M85 57h28V28h49m64 0h56v58h-56m-64 0h-49V57m169 0h34"/><rect x="162" y="15" width="64" height="26" rx="3" fill="#f7f8ec"/><rect x="162" y="73" width="64" height="26" rx="3" fill="#f7f8ec"/><g fill="#234d40"><circle cx="113" cy="57" r="3"/><circle cx="282" cy="57" r="3"/></g></g><text x="179" y="325" fill="#234d40" font-family="monospace" font-size="16" font-weight="400" letter-spacing="0">6 Ω</text><text x="179" y="383" fill="#234d40" font-family="monospace" font-size="16" font-weight="400" letter-spacing="0">3 Ω</text><text x="48" y="354" fill="#234d40" font-family="monospace" font-size="14" font-weight="400" letter-spacing="0">+9 V</text><text x="321" y="354" fill="#234d40" font-family="monospace" font-size="14" font-weight="400" letter-spacing="0">0 V</text><text x="24" y="464" fill="#9d381f" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1">IN YOUR NOTEBOOK</text><text x="24" y="494" fill="#1b322e" font-family="system-ui,sans-serif" font-size="17" font-weight="400" letter-spacing="0">Find each branch current and the total.</text><text x="24" y="521" fill="#1b322e" font-family="system-ui,sans-serif" font-size="17" font-weight="400" letter-spacing="0">Open the 3 Ω path. What changes?</text><rect x="24" y="552" width="352" height="49" rx="5" fill="#214b3e"/><text x="44" y="583" fill="#fff9e6" font-family="system-ui,sans-serif" font-size="18" font-weight="650" letter-spacing="0">Learn the concept</text><text x="335" y="583" fill="#fff9e6" font-family="system-ui,sans-serif" font-size="19" font-weight="400" letter-spacing="0">→</text><text x="24" y="635" fill="#1b322e" font-family="system-ui,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Source &amp; identity</text><text x="310" y="635" fill="#1b322e" font-family="system-ui,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Share ↗</text><rect x="24" y="650" width="352" height="1" rx="0" fill="#cabfa7"/></svg>
