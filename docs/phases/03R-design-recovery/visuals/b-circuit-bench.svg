th="332" height="1" rx="0" fill="#294553"/><rect x="34" y="302" width="332" height="1" rx="0" fill="#294553"/><rect x="34" y="342" width="332" height="1" rx="0" fill="#294553"/><rect x="34" y="382" width="332" height="1" rx="0" fill="#294553"/><text x="35" y="231" fill="#b4e382" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0">SCHEMATIC    /    9 V IDEAL SOURCE</text><g transform="translate(0 245)" fill="none" stroke="#dcf4d4" stroke-width="2.5" stroke-linejoin="round"><path d="M85 57h28V28h49m64 0h56v58h-56m-64 0h-49V57m169 0h34"/><rect x="162" y="15" width="64" height="26" rx="3" fill="#203a49"/><rect x="162" y="73" width="64" height="26" rx="3" fill="#203a49"/><g fill="#dcf4d4"><circle cx="113" cy="57" r="3"/><circle cx="282" cy="57" r="3"/></g></g><text x="179" y="278" fill="#dcf4d4" font-family="monospace" font-size="16" font-weight="400" letter-spacing="0">6 Ω</text><text x="179" y="336" fill="#dcf4d4" font-family="monospace" font-size="16" font-weight="400" letter-spacing="0">3 Ω</text><text x="48" y="307" fill="#dcf4d4" font-family="monospace" font-size="14" font-weight="400" letter-spacing="0">+9 V</text><text x="321" y="307" fill="#dcf4d4" font-family="monospace" font-size="14" font-weight="400" letter-spacing="0">0 V</text><rect x="35" y="368" width="157" height="36" rx="6" fill="#b9ed94"/><text x="49" y="391" fill="#1a3028" font-family="system-ui,sans-serif" font-size="15" font-weight="650" letter-spacing="0">Both closed</text><rect x="199" y="368" width="163" height="36" rx="6" fill="#324d5b"/><text x="215" y="391" fill="#e6edf1" font-family="system-ui,sans-serif" font-size="15" font-weight="400" letter-spacing="0">Open 3 Ω path</text><text x="22" y="466" fill="#badb86" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0">01    PREDICT BEFORE SWITCHING</text><text x="22" y="502" fill="#f5f8ef" font-family="system-ui,sans-serif" font-size="22" font-weight="620" letter-spacing="0">What will the source supp