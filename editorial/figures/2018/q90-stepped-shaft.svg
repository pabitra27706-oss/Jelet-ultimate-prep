<title id="fig-2018-90-title">Fixed stepped shaft with torque at its free end</title>
<desc id="fig-2018-90-desc">A circular shaft is fixed at A on the left. Its first half AB has diameter D and second half BC has diameter D/2. A dashed centre line passes through A, B and C. A curved torque arrow labelled T is drawn around the free end C.</desc>
