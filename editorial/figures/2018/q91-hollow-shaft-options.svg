<title id="fig-2018-91-title">Hollow shaft section and four candidate shear stress profiles</title>
<desc id="fig-2018-91-desc">An annular shaft section has a marked vertical diameter and horizontal centre line. A: curved positive upper and negative lower lobes separated by a blank central interval. B: straight triangular upper-right and lower-left lobes separated by a blank central interval. C: one straight line from the upper right through the centre to the lower left, with no central gap. D: a single rightward bowed distribution extending over the full depth. The options are labelled A, B, C and D.</desc>
