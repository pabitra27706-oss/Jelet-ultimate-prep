<title id="fig-2018-85-title">Particle inside a hollow sphere above its lowest point</title>
<desc id="fig-2018-85-desc">A circular section of a fixed hollow sphere rests on a horizontal base. Dashed horizontal and vertical diameters intersect at its centre. A radius r points toward the upper left. A particle lies on the lower-right inner surface, at vertical height h above the bottom-most point.</desc>
