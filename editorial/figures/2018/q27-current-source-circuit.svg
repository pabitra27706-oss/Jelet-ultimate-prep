<title id="fig-2018-27-title">Circuit with a voltage source, current source and two resistors</title>
<desc id="fig-2018-27-desc">A 12 V source in the left branch has its positive terminal at the top. A 6 ohm resistor connects its top terminal to a second top node. Between that second top node and the common bottom wire are a 2 A current source directed upward and a 4 ohm resistor in parallel.</desc>
