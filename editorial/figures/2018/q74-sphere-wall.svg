<title id="fig-2018-74-title">Sphere held against a vertical wall by a string</title>
<desc id="fig-2018-74-desc">A sphere touches a smooth vertical wall on its left. A string runs down and right from an attachment higher on the wall to a point on the upper-left surface of the sphere. The angle phi is marked between the vertical wall and the string.</desc>
