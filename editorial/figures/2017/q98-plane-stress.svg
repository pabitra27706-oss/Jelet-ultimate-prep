<title id="fig-2017-98-title">Plane stress element with normal and shear stresses</title>
<desc id="fig-2017-98-desc">A square stress element has x pointing right and y upward. Horizontal normal stresses of 40 MPa pull outward on both side faces. Vertical normal stresses of 10 MPa push inward on the top and bottom faces. Shear arrows point right on top, upward on the right, left on the bottom and downward on the left; shear labels read 15 MPa.</desc>
