<title id="fig-2017-90-title">Cantilever with a returning rigid bracket at its free end</title>
<desc id="fig-2017-90-desc">Cantilever AB extends horizontally right from the fixed wall at A to B, over length L. A rigid bracket runs down from B then left to C. The horizontal distance from C to the vertical through B is a. A force P acts vertically downward at C.</desc>
