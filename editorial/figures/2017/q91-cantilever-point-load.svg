<title id="fig-2017-91-title">Cantilever with a downward force at an intermediate point</title>
<desc id="fig-2017-91-desc">A horizontal cantilever of total length L is fixed at the left wall. A transverse force P points downward at a point a from the fixed end, leaving an unloaded overhang to the right free end.</desc>
