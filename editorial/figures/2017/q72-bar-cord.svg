<title id="fig-2017-72-title">Horizontal bar AB supported by cord BC</title>
<desc id="fig-2017-72-desc">A horizontal bar AB is hinged at A on the left wall. Cord BC joins its right end B to C higher on that wall. The angle between the bar and cord at B is 30 degrees.</desc>
