<title id="fig-2017-81-title">Force versus time with an 80-newton plateau</title>
<desc id="fig-2017-81-desc">Force in newtons is plotted against time in seconds. It stays at 80 N from zero to 5 seconds, then decreases linearly to zero at 10 seconds. A dashed vertical guide marks 5 seconds.</desc>
