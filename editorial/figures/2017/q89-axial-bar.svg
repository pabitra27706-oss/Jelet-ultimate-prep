<title id="fig-2017-89-title">Fixed bar with opposed axial point loads</title>
<desc id="fig-2017-89-desc">A straight bar is fixed to the left wall. Its total length is marked as two successive 2 m intervals. A 2 kN force points right at a point x from the fixed end. A 1.5 kN force at the right end points left.</desc>
