<title id="fig-2017-73-title">Equilateral triangular plate pivoted at its upper vertex</title>
<desc id="fig-2017-73-desc">A triangular plate hangs from a pivot at its upper vertex. Both base angles are labelled 60 degrees. The horizontal base is dimensioned a. A support above the pivot holds the upper vertex.</desc>
