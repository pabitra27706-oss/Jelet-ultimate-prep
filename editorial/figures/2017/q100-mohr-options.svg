<title id="fig-2017-100-title">Stress element and four candidate Mohr circles</title>
<desc id="fig-2017-100-desc">A square element has outward horizontal normal stress sigma on both side faces and shear tau: rightward on top, upward on the right, leftward on the bottom, downward on the left. Axes x right and y up are shown. Each option uses horizontal sigma and vertical tau axes. A: circle lies entirely right of the tau axis. B: circle touches the tau axis on its left. C: circle crosses the tau axis with its centre right of that axis. D: circle is centred at the axes intersection.</desc>
