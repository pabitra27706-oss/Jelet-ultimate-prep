<title id="fig-2019-84-title">Two fixed pulleys and a movable pulley connected to blocks A and B</title>
<desc id="fig-2019-84-desc">Two upper pulleys are fixed to a ceiling. A single string starts at block B, passes over the left fixed pulley, under the central lower pulley, over the right fixed pulley and down to block A. The axle of the lower pulley is also attached to B. A downward velocity arrow at A is labelled 4 m/s.</desc>
