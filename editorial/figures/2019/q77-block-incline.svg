<title id="fig-2019-77-title">Rectangular block resting on an inclined plane</title>
<desc id="fig-2019-77-desc">A uniform rectangular block rests with its width along a plane rising to the right. Its width a is dimensioned across the top parallel to the plane, and its height h is dimensioned along its right side perpendicular to the plane. A horizontal reference line lies beneath the incline.</desc>
