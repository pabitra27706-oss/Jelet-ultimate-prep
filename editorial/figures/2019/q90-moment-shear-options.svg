<title id="fig-2019-90-title">Bending moment diagram and four shear force alternatives</title>
<desc id="fig-2019-90-desc">The given moment plot has equally spaced baseline points A, B, C, D, E. It rises linearly from Q below A through B to P above C, then falls through D to R below E. AQ, PC and ER have equal magnitude. Shear alternatives: A: constant positive level from A to C then equal negative level to E. B: constant positive level throughout. C: a straight fall from positive at A through zero at C to negative at E. D: a triangular negative trough with zero at A and E and its minimum at C.</desc>
