<title id="fig-2024-49-title">Two-part rod for heat conduction</title>
<desc id="fig-2024-49-desc">Two equal-cross-section rod segments are joined end to end. The left segment has length l and thermal conductivity k; the right has length 2l and conductivity 2k. End temperatures are t1 on the left and t2 on the right.</desc>
