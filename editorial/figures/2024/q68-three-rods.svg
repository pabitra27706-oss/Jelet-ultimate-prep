<title id="fig-2024-68-title">Three conducting rods meeting at a junction</title>
<desc id="fig-2024-68-desc">Three rods meet at a junction: B extends upper left to a 100 degree Celsius end, A extends lower left to a 0 degree Celsius end, and C extends right to another 100 degree Celsius end. A and B have equal dimensions; the stem states C has twice their length and cross-sectional area.</desc>
