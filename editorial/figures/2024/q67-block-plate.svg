<title id="fig-2024-67-title">Block pressed against an accelerating rough vertical plate</title>
<desc id="fig-2024-67-desc">A perspective drawing shows a vertical plate and a small block touching its front face. The block is labelled 1 kg. A horizontal arrow labelled a points left from near the plate, showing the plate acceleration direction.</desc>
