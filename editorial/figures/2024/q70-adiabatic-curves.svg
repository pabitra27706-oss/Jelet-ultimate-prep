<title id="fig-2024-70-title">Two pressure-volume curves from a common state</title>
<desc id="fig-2024-70-desc">The vertical axis is P and the horizontal axis V. Two falling curves begin at the same high-pressure point. Gas 1 follows the more steeply falling lower curve; gas 2 follows the less steeply falling upper curve.</desc>
