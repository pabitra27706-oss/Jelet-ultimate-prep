<title id="fig-2024-43-title">Refraction at the boundary of two media</title>
<desc id="fig-2024-43-desc">A horizontal boundary separates medium 1 below from medium 2 above. A dashed vertical normal crosses the boundary. The incident ray travels from the lower left toward the crossing in medium 1; the refracted ray travels toward the upper right in medium 2. Alpha 1 is between the lower normal and incident ray; alpha 2 is between the upper normal and refracted ray. Alpha 2 is drawn larger than alpha 1.</desc>
