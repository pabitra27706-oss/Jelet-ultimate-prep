<title id="fig-2024-89-title">Four alcohol and carbonyl compound alternatives</title>
<desc id="fig-2024-89-desc">A: CH3OH. B: a benzene ring bonded to a carbonyl carbon whose other single bond is to OCH3. C: CH3CH2OH. D: a benzene ring bonded to a carbonyl carbon whose other single bond is to CH3. Each carbonyl has a double bond to oxygen.</desc>
