<title id="fig-2024-45-title">Circular motion about a centre and a point on the circumference</title>
<desc id="fig-2024-45-desc">A circle has centre C and point O at its leftmost edge. A dashed horizontal diameter passes through O and C. A radius from C goes to a particle in the upper-right quadrant, making angle theta with the rightward horizontal. Velocity v is tangent at the particle and points up and left.</desc>
