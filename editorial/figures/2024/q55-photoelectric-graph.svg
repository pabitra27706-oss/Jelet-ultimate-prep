<title id="fig-2024-55-title">Stopping potential plotted against frequency</title>
<desc id="fig-2024-55-desc">The vertical axis is stopping potential V0 and the horizontal axis frequency nu, meeting at O. A straight rising line starts at A below O on the vertical axis, crosses the positive frequency axis at B and extends to C in the first quadrant.</desc>
