<title id="fig-2024-61-title">Four potential and kinetic energy versus time options</title>
<desc id="fig-2024-61-desc">Four energy-versus-time options, each with dashed guides at energy mgH and the endpoint time. A: V falls with increasing steepness while K rises with increasing steepness, ending at square root of 2h/g. B: V falls with increasing steepness while K rises with decreasing steepness, ending at square root of 2h/g. C: the descending curve flattens while the ascending curve steepens, ending at square root of 2h/g. D: the descending curve steepens while the ascending curve steepens, ending at square root of h/g. V and K are labelled only in A and B as in the source.</desc>
