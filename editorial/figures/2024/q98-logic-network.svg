<title id="fig-2024-98-title">Two exclusive-OR stages feeding a three-input NAND gate</title>
<desc id="fig-2024-98-desc">A and B feed an exclusive-OR-shaped gate with an output inversion bubble. B and C feed an exclusive-OR gate without a bubble. The two gate outputs and a separate direct branch from C feed three inputs of an AND-shaped gate with an output inversion bubble. The final output is X.</desc>
