<title id="fig-2024-94-title">Branched cell network with four terminal voltages</title>
<desc id="fig-2024-94-desc">An upper junction connects to V1 through a 4 V cell positive toward V1, and to a 2 V terminal through an 8 V cell positive toward the junction. A vertical cell E has its positive plate at the upper junction and negative at a lower junction. The lower junction connects directly to a 10 V terminal and through another 8 V cell to V2, with that cell positive toward the lower junction.</desc>
