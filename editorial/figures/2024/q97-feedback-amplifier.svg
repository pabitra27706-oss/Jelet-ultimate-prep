<title id="fig-2024-97-title">Current source feeding an inverting amplifier network</title>
<desc id="fig-2024-97-desc">A 100 mA current source points upward from ground into the inverting input node. A 1 kilohm resistor connects the same node to ground. A 100 ohm feedback resistor connects the inverting node to output V0. The non-inverting input is connected to ground.</desc>
