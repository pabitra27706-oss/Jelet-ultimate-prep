<title id="fig-2021-74-title">Trapezoidal sheet with symbolic centroid height</title>
<desc id="fig-2021-74-desc">A trapezoid has shorter horizontal top side a and longer horizontal base b. Its perpendicular height is h. A point marked C.G. lies on a dashed horizontal level inside the sheet. The vertical distance from the base to that level is y-bar.</desc>
