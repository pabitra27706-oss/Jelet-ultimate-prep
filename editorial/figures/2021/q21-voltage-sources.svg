<title id="fig-2021-21-title">Five voltage sources joined at two central nodes</title>
<desc id="fig-2021-21-desc">Two central nodes are connected by source E, whose long plate is toward the upper node. The upper node branches through 2 V to terminal V2 and through 1 V to terminal 0 V; both branches have their long plates toward the outer terminals. The lower node branches through 4 V to terminal V1 with its long plate toward V1, and through 5 V to terminal 10 V with its long plate toward the central node.</desc>
