<title id="fig-2021-71-title">Block on a rough horizontal surface with an oblique pulling force</title>
<desc id="fig-2021-71-desc">A block labelled W rests on a rough horizontal surface. An arrow P pulls the block upward and to the right. The source drawing gives no numerical pulling angle.</desc>
