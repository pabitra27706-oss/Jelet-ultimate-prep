<title id="fig-2021-93-title">Circular cantilever with a transverse rigid strip and opposing end forces</title>
<desc id="fig-2021-93-desc">A circular cantilever of length L and radius R projects from a fixed wall. At its free end it carries the midpoint of a rigid horizontal strip of total length 2L, with length L to each end. End A has an upward vertical force P and end B a downward vertical force P. The cantilever material is labelled E and G.</desc>
