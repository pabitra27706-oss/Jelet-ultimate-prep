<title id="fig-2021-84-title">Horizontal hinged rod held by an upward force at its free end</title>
<desc id="fig-2021-84-desc">A uniform rod labelled weight W extends horizontally from a wall hinge at its left end. Its length is L. A vertical force F points upward at the right free end.</desc>
