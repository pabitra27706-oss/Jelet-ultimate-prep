<title id="fig-2021-87-title">Shaft fixed at both ends with an interior torque</title>
<desc id="fig-2021-87-desc">A solid circular rod of diameter d is fixed at both ends. Its total length is L. A torque T is applied at a point L/4 from the left fixed end. A diameter indicator labels d near the right side.</desc>
