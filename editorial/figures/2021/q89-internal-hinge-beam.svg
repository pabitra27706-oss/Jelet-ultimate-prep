<title id="fig-2021-89-title">Two bars joined by an internal hinge with a midspan load on the right bar</title>
<desc id="fig-2021-89-desc">Two equal-length bars AB and BC, each of length L, meet at a hinge B. A is fixed to a wall and C is simply supported. A downward load P acts halfway along BC, at distance L/2 from B.</desc>
