<title id="fig-2021-94-title">Given shear-force and bending-moment diagrams for ABCD</title>
<desc id="fig-2021-94-desc">The shear plot is minus 300 N over AB and plus 200 N from B to D. Distances AB, BC and CD are 10 m, 10 m and 15 m. The moment plot is labelled negative and is drawn above its lower baseline as in the source: zero at A, magnitude 3000 Nm at B, decreasing to 1000 Nm just left of C, jumping to 3000 Nm at C and then decreasing to zero at D.</desc>
