<title id="fig-2021-72-title">Triangular truss hinged to a wall and restrained by a horizontal rope</title>
<desc id="fig-2021-72-desc">Truss ABC has horizontal base AB, upper node C and angle ABC equal to 60 degrees. A is hinged to a vertical wall. A horizontal rope joins C to D on the wall. A weight W acts downward at B. The three sides are truss members; AB equals BC as stated in the stem.</desc>
