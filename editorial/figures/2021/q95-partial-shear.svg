<title id="fig-2021-95-title">Partial shear-force diagram with a jump at B</title>
<desc id="fig-2021-95-desc">The baseline runs from A through B to C. Shear falls linearly from zero at A to minus 6 kN at B, over 3 m. It jumps at B to plus 14 kN and decreases linearly to zero at C over 7 m. Vertical hatching marks the two triangular areas.</desc>
