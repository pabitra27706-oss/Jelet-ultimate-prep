<title id="fig-2022-96-title">Sinusoidal source with a reverse-oriented series diode and load resistor</title>
<desc id="fig-2022-96-desc">A source labelled Vm sin omega t connects through a diode in the top wire to the load. The diode triangle points left and its cathode bar is on the source side. A resistor joins the top output node to the bottom return wire. Output v0(t) is marked positive at the top and negative at the bottom.</desc>
