<title id="fig-2022-98-title">Open-switch network labelled A through G</title>
<desc id="fig-2022-98-desc">Input switch A is in series with a two-branch network, followed by series switch G and output Y. The upper branch has switches B and C in parallel. The lower branch has D and E in parallel followed by F in series. All switches are drawn open.</desc>
