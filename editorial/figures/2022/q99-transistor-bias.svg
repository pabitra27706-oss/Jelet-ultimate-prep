<title id="fig-2022-99-title">Transistor circuit with emitter and collector bias supplies</title>
<desc id="fig-2022-99-desc">A transistor has its base connected vertically to the common bottom node. Its emitter branch rises to the left supply VEB; the emitter arrow points outward toward that supply. VEB has negative at the top and positive at the common bottom node. The collector branch rises right through a 100 ohm resistor to the positive terminal of VCC, whose negative terminal is at the common node. IC points left into the collector. VCB is marked positive at the collector and negative at the base.</desc>
