<title id="fig-2022-97-title">Comparator with a sinusoidal non-inverting input and a 3-volt reference</title>
<desc id="fig-2022-97-desc">The sinusoidal input v1 connects to the comparator plus input. The minus input connects to the positive terminal of a 3 V source whose negative terminal is grounded. The comparator output is labelled v0.</desc>
