<title id="fig-2022-55-title">Two states on a constant-pressure line</title>
<desc id="fig-2022-55-desc">A pressure-volume plot has P on the vertical axis and V on the horizontal axis. A horizontal constant-pressure line contains state A on the left and state B farther right, at greater volume.</desc>
