<title id="fig-2022-62-title">Given volume-temperature cycle and four pressure-volume alternatives</title>
<desc id="fig-2022-62-desc">The given V-T plot has A at lower left, B at upper right and C directly above A at the same volume as B. Arrows run A to B along a rising diagonal, B to C leftward, then C to A downward. P-V alternatives: A: AB is a shallow descending curve, BC vertical downward, CA a lower returning curve. B: AB downward vertical, BC rightward horizontal, CA a returning curve. C: AB rightward horizontal, BC downward vertical, CA a returning curve. D: the same horizontal and vertical sides as C but a straight diagonal CA. Each option follows A-B-C-A.</desc>
