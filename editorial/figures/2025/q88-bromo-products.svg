<title id="fig-2025-88-title">Alkene reaction with four candidate structures</title>
<desc id="fig-2025-88-desc">The reactant is (CH3)3C–CH=CH2 with HBr over the reaction arrow. Candidate I: (CH3)3C–CH(Br)–CH3. II: CH3–C(CH3)(Br)–CH(CH3)–CH3. III: (CH3)3C–CH2–CH2Br. IV: BrCH2–CH(CH3)–CH(CH3)–CH3, with the first central H explicit. Options A: I; B: II; C: I and II; D: III and IV.</desc>
