<title id="fig-2025-67-title">Hanging block and a force applied to the other string end</title>
<desc id="fig-2025-67-desc">A fixed ceiling pulley carries a string with a 2 kg block hanging on the left. The right string end extends downward with a downward arrow labelled F = 40 N. No velocity or displacement arrow is shown on the block.</desc>
