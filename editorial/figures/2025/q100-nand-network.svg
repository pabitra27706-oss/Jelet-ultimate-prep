<title id="fig-2025-100-title">Three NAND gates with crossed input branches</title>
<desc id="fig-2025-100-desc">Input A feeds one input of each of two first-stage NAND gates. Input B feeds the other input of each. A bridge where the B branch crosses the A branch indicates no junction there. Both first-stage outputs feed a third NAND gate with output Y. Each gate has an output inversion bubble.</desc>
