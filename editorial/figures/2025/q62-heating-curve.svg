<title id="fig-2025-62-title">Temperature versus heat input with two plateaux</title>
<desc id="fig-2025-62-desc">A temperature versus heat-input plot rises from the origin to A, stays horizontal from A to B, rises from B to C, stays horizontal from C to D, then rises from D to E. No numerical temperatures or heat inputs are marked.</desc>
