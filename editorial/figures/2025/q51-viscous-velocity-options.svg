<title id="fig-2025-51-title">Four velocity-time graphs for a falling body</title>
<desc id="fig-2025-51-desc">Each option plots v vertically against t horizontally. A: velocity rises from zero and flattens to a positive plateau. B: velocity falls from a high initial value to a lower positive plateau. C: velocity rises from zero to a peak and then falls toward zero. D: velocity rises from zero, passes through a nearly level positive section and rises steeply again.</desc>
