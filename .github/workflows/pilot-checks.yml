name: Learning pilot checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/pilot-checks.yml'
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run test:browser
