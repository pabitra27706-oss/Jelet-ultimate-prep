name: Learning pilot checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/pilot-checks.yml'
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Validate provisional answer integration
        run: |
          npm run validate:keys
          npm run test:key-safety
          node scripts/build-content.mjs --check
      - run: npm run build
      - run: python3 docs/phases/01-evidence/check_inventory.py
      - name: Run the scoring and review rules
        run: npm run test:rules
      - name: Run the exam rehearsal suite
        run: npm run test:phase05
      - name: Run the offline and release suite
        run: npm run test:phase06
      - name: Run the curriculum coverage suite
        run: npm run test:phase07
      - name: Run the optional-service decision suite
        run: npm run test:phase08
      - name: Run the browser, offline and accessibility suite
        run: npm run test:browser
