name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/1e582bac-jelet-ultimate-prep
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      # The deploy gate itself must be able to trigger a deploy.
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jelet-pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: python3 docs/phases/01-evidence/check_inventory.py
      # A deployment must not be able to publish a build the suites reject,
      # so every suite runs before the artifact is uploaded.
      - name: Run the scoring and review rules
        run: npm run test:rules
      - name: Run the exam rehearsal suite
        run: npm run test:phase05
      - name: Run the offline and release suite
        run: npm run test:phase06
      - name: Run the curriculum coverage suite
        run: npm run test:phase07
      - name: Run the optional-service decision suite
        run: npm run test:phase08
      - name: Run the browser, offline and accessibility suite
        run: npm run test:browser
      - name: Verify the public artifact allowlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import sys
          root = Path('dist')
          allowlist = json.loads(Path('scripts/public-artifact.json').read_text())
          allowed = set(allowlist['files'])
          directories = tuple(allowlist['assetDirectories'])
          files = sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          extra = [f for f in files if f not in allowed and not f.startswith(directories)]
          missing = sorted(allowed - set(files))
          if extra or missing:
              print('Unexpected:', extra, 'Missing:', missing, file=sys.stderr)
              sys.exit(1)
          print(f'Artifact OK: {len(files)} files, {sum(p.stat().st_size for p in root.rglob("*") if p.is_file())} raw bytes')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
