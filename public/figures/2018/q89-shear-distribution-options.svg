<title id="fig-2018-89-title">Four shear stress distributions through a rectangular beam depth</title>
<desc id="fig-2018-89-desc">Four profiles show rightward shear arrows across depth d, with a dashed mid-depth line. A: a curved profile with large values at the top and bottom and a smaller nonzero value at mid-depth. B: two straight segments reaching zero at mid-depth and maxima at the top and bottom. C: a constant rectangular profile. D: a bowed profile with zero at both ends and a maximum at mid-depth.</desc>
