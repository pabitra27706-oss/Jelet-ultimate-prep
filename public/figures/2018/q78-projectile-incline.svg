<title id="fig-2018-78-title">Projectile range measured along an inclined plane</title>
<desc id="fig-2018-78-desc">A projectile launches from the foot of an incline with velocity u and lands farther up the incline. The path arches above the plane. Alpha is the launch angle with the horizontal; beta is the inclination with the horizontal. R measures the distance along the plane from launch to landing.</desc>
