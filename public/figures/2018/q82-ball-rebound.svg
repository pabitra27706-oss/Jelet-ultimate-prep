<title id="fig-2018-82-title">Vertical incidence and horizontal rebound from an inclined plane</title>
<desc id="fig-2018-82-desc">A ball approaches vertically downward and meets a fixed plane that slopes downward to the right at 30 degrees to the horizontal. The rebound arrow points horizontally to the right from the ball.</desc>
