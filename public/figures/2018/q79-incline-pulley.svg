<title id="fig-2018-79-title">Weight on an incline connected to a hanging weight</title>
<desc id="fig-2018-79-desc">Weight W2 rests on an inclined plane rising to the right. A string parallel to the plane passes over a pulley at the upper end and descends to the freely hanging weight W1 on the right. The incline angle with the horizontal is alpha.</desc>
