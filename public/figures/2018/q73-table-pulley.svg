<title id="fig-2018-73-title">Mass on a smooth table connected to a hanging mass</title>
<desc id="fig-2018-73-desc">Mass m2 rests on a horizontal table to the left of a smooth pulley at the right edge. A horizontal string from m2 passes over the pulley and descends to hanging mass m1. Tension T points right toward the pulley on the horizontal part and upward on the hanging part.</desc>
