<title id="fig-2018-80-title">Three-panel plane truss with two downward loads</title>
<desc id="fig-2018-80-desc">The bottom nodes from left to right are A, G, H, B; top nodes are C, D, E, F. Horizontal chords join adjacent nodes. Vertical members are AC, GD, HE and BF; diagonal members are CG, DH and HF. A has a pin support and B a roller support. Loads of 9 kN and 12 kN act downward at G and H. Each of the three bottom panels is 3 m wide.</desc>
