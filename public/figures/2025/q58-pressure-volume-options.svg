<title id="fig-2025-58-title">Four pressure-volume path alternatives</title>
<desc id="fig-2025-58-desc">A: A at upper left connects by a straight descending path to the right, followed by a horizontal leftward return to B. B: A at upper left follows a descending curved path to the right and a horizontal leftward return to B. C: A at lower left follows a horizontal rightward path, then a curved up-left return to B. D: A at upper left follows a curved down-right path and a straight down-left return to B. Panels A–C mark volumes V and 3V; D has unnumbered vertical guides.</desc>
