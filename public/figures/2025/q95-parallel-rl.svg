<title id="fig-2025-95-title">Two parallel resistor-inductor branches</title>
<desc id="fig-2025-95-desc">Total current I enters a left junction and splits into upper current I1 and lower current I2, both directed right. The upper branch has resistor R1 followed by inductor L1; the lower has resistor R2 followed by inductor L2. The branches rejoin on the right.</desc>
