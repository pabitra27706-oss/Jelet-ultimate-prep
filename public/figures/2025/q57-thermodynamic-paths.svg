<title id="fig-2025-57-title">Pressure-volume paths through four states</title>
<desc id="fig-2025-57-desc">The P-V plot places a at lower left, c upper left, b upper right and d lower right. Arrows go a to c upward, c to b rightward, a to d rightward and d to b upward. A curved path connecting b to a has an arrow directed down and left toward a.</desc>
