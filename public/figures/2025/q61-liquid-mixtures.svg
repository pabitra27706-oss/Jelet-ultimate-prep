<title id="fig-2025-61-title">Equal masses and pairwise mixture temperatures</title>
<desc id="fig-2025-61-desc">Three equal masses m of liquids A, B and C are shown left to right at 10, 15 and 20 degrees Celsius. An arc joins A and B with label 13 degrees Celsius. Another arc joins B and C with label 16 degrees Celsius.</desc>
