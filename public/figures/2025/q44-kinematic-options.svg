<title id="fig-2025-44-title">Acceleration graph and four velocity-time alternatives</title>
<desc id="fig-2025-44-desc">The given a-versus-t line starts at acceleration −2 when t=0, crosses a=0 at t=1 and continues upward. Four v-versus-t alternatives start at zero. A: a positive arch returning to zero at t=2, with t=1 marked. B: zero until t=1, then a straight rise to a plateau. C: a curve dipping below zero and crossing back at t=2 before rising above zero, with t=1 marked. D: straight rise to a plateau from t=1 to t=2, then straight fall to zero.</desc>
