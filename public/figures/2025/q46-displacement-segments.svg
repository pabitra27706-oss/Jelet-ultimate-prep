<title id="fig-2025-46-title">Displacement-time graph labelled A to E</title>
<desc id="fig-2025-46-desc">A displacement-time graph runs from A low on the left to B higher up by a straight rising segment. BC is a curved dip ending at high point C. CD is a straight falling segment to lower point D. DE is a rising curve that becomes flatter toward E.</desc>
