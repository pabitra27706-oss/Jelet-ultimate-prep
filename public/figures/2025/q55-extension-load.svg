<title id="fig-2025-55-title">Extension-load lines for two wires</title>
<desc id="fig-2025-55-desc">Extension is on the vertical axis and load on the horizontal axis. Two straight lines start at their common origin. The line marked B rises more steeply than the line marked A. No numerical tick marks are shown.</desc>
