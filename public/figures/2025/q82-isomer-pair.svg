<title id="fig-2025-82-title">Pair of carbonyl-containing chemical structures</title>
<desc id="fig-2025-82-desc">The left structure is CH3–CH2–C(=O)–OH, drawn with a two-carbon skeletal chain to the carbonyl. The right structure is H–C(=O)–O–CH2–CH3. Both carbonyl double bonds and the explicit H, O and OH labels are shown.</desc>
