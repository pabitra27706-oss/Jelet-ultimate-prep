<title id="fig-2025-66-title">Four displacement-time graphs with a four-second reference</title>
<desc id="fig-2025-66-desc">Each panel has x vertically and t horizontally with a dashed guide at t=4. A: a rising concave-down curve followed by a descending straight line. B: a rising concave-down curve followed by a steep rising straight line. C: a rising concave-up curve followed by a horizontal line. D: a rising concave-up curve followed by a rising straight line.</desc>
