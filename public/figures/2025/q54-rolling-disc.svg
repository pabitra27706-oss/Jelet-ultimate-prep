<title id="fig-2025-54-title">Disc rolling from a horizontal surface up a curved ramp</title>
<desc id="fig-2025-54-desc">A disc starts on a horizontal surface on the left with rightward velocity V. The surface curves upward to the right, with a second disc position near the top. A dashed vertical line from the upper position to the baseline is labelled h.</desc>
