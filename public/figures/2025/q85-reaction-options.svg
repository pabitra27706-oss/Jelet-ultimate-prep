<title id="fig-2025-85-title">Acetylene reaction and four product alternatives</title>
<desc id="fig-2025-85-desc">HC≡CH is followed by reagents (i) NaNH2 in liquid NH3 and (ii) ethylbromide in excess. A: CH3CH2–CH=CH–CH2CH3. B: CH3CH2–C≡C–CH2CH3. C: CH3CH2–CH=CH–NH2. D: Br–CH=CH–NH2. The drawn double-bond substituents extend on opposite sides as in the source.</desc>
