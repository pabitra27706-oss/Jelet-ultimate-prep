<title id="fig-2025-81-title">Branched hydrocarbon with a triple bond and a double bond</title>
<desc id="fig-2025-81-desc">The left chain reads CH3–CH2–C≡C–CH. That CH branches upward to CH2–CH bearing two CH3 groups, and downward to CH=CH2. Single, double and triple bonds and all printed CH, CH2 and CH3 labels are retained.</desc>
