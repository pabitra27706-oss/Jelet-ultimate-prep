<title id="fig-2017-75-title">Weight suspended by two cables between rigid walls</title>
<desc id="fig-2017-75-desc">A weight W hangs vertically below a junction. Cable T1 rises to the left rigid wall at angle theta above the left horizontal. Cable T2 rises to the right rigid wall at 60 degrees above the right horizontal. Tension arrows point away from the junction along each cable.</desc>
