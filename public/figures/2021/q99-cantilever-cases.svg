<title id="fig-2021-99-title">Two loading cases on the same cantilever beam</title>
<desc id="fig-2021-99-desc">Two equal cantilevers of rigidity EI are fixed at the left. The first has a downward tip load W and total length L, with tip deflection delta1. The second has two downward loads W/2, one at midspan and one at the tip; each half is L/2, with tip deflection delta2. Dashed downward curves indicate deformation.</desc>
