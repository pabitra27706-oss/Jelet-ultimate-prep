<title id="fig-2021-35-title">Four candidate fluorescent tube wiring diagrams</title>
<desc id="fig-2021-35-desc">Each candidate has tube T with two filament terminals at each end and two AC supply terminals. A: the starter joins the upper filament terminals, while the ballast is in the lower-left supply lead. B: the ballast joins the upper terminals and the starter is in the lower-left supply lead. C: the ballast joins the upper terminals and the starter is in the lower-right supply lead. D: ballast and starter are parallel between the upper terminals, with the supply connected to the lower terminals.</desc>
