<title id="fig-2021-33-title">Resistor bridge with a central galvanometer</title>
<desc id="fig-2021-33-desc">A diamond bridge has 12 ohms on its upper-left arm, 24 ohms upper-right, 6 ohms lower-left and 12 ohms lower-right. Galvanometer G connects the top and bottom vertices. A 6 V source connects the left and right vertices by an outer bottom loop, with positive on the left.</desc>
