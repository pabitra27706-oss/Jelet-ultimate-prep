<title id="fig-2021-81-title">Cylinder descending as a fixed cord unwinds</title>
<desc id="fig-2021-81-desc">A cord is fixed overhead and runs vertically down tangent to the left of a cylinder. A dashed circle marks the initial cylinder position and a solid circle below marks the later position. Their centres are separated vertically by h. The lower cylinder is labelled mass m, with a radius r.</desc>
