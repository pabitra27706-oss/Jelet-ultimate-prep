<title id="fig-2021-75-title">Side views of two meshing external spur gears</title>
<desc id="fig-2021-75-desc">Two adjacent gear side views are labelled Gear-1 above and Gear-2 below. Dashed horizontal axes through their centres are labelled 1–1 and 2–2. Curved angular-velocity arrows omega1 and omega2 turn in opposite senses.</desc>
