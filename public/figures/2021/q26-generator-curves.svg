<title id="fig-2021-26-title">Four terminal-voltage versus load-current curves</title>
<desc id="fig-2021-26-desc">Each option plots V vertically and load current IL horizontally. A: voltage first rises along a curved arch then falls. B: a rising straight line with a positive intercept. C: a falling curve, steep initially and then flattening. D: a falling straight line with a positive intercept.</desc>
