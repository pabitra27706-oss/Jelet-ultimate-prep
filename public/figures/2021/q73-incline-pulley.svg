<title id="fig-2021-73-title">Inclined mass m1 connected to hanging mass m2</title>
<desc id="fig-2021-73-desc">Mass m1 rests on an incline rising to the right at angle alpha to the horizontal. An inextensible string runs up the incline over a smooth pulley and vertically down to hanging mass m2 on the right.</desc>
