<title id="fig-2019-76-title">Cone with apex angle 60 degrees and an axial point G</title>
<desc id="fig-2019-76-desc">A right circular cone has apex A, base-edge points B and C, and base centre D. The apex angle is 60 degrees. The axis AD and base diameter BC are dashed. A point G is shown on the axis between A and D. The source drawing does not show the scooped-out sphere.</desc>
