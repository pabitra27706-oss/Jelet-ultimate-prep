<title id="fig-2019-75-title">Square lamina hinged to a wall and held by a horizontal string</title>
<desc id="fig-2019-75-desc">A square lamina is drawn as a diamond, with left corner A hinged to a vertical wall and opposite corner C at the same height. The top corner B is joined horizontally to the wall by a string. T points left along that string. A separate weight W acts downward at C.</desc>
