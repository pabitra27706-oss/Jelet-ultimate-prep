<title id="fig-2019-91-title">Overhanging beam with three equal loads and four moment alternatives</title>
<desc id="fig-2019-91-desc">A uniform beam has successive points A, B, C, D and E separated by equal lengths L. Supports are at B and D. Equal downward loads W act at A, C and E. Moment alternatives: A: zero at A and E, negative troughs at B and D and a less-negative point at C. B: zero at A, C and E, with negative troughs at B and D. C: zero at A and E, negative troughs at B and D and a positive peak at C. D: negative at A and E, zero at B and D and positive at C; the segments form an inverted V.</desc>
