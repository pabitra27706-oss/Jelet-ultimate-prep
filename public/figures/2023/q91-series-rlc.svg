      <path class="fig-plate" stroke="none" d="M 298 58 L 304 58 L 304 102 L 298 102 Z" />
      <path d="M 304 80 L 350 80" />
    </g>
    <text class="fig-lbl" x="62" y="196" font-size="14" text-anchor="end">i(t)</text>
    <text class="fig-lbl" x="158" y="116" font-size="14" text-anchor="middle">3 Ω</text>
    <text class="fig-lbl" x="239" y="116" font-size="14" text-anchor="middle">2 mH</text>
    <text class="fig-lbl" x="296" y="116" font-size="14" text-anchor="middle">500 µF</text>
    <g class="fig-ln" stroke-width="2" stroke-linecap="round">
      <path d="M 440 300 L 440 90" />
      <path d="M 420 205 L 710 205" />
    </g>
      <path class="fig-acc" stroke-width="2.6" d="M 440 255 L 560 155 L 680 255" />
