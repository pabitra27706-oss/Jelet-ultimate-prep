      <path class="fig-acc" d="M 100 177 L 108 177 L 108 185" />
      <rect class="fig-fill" x="135" y="68" width="46" height="24" rx="4" />
      <path d="M 205 80 A 8.5 8.5 0 0 1 222 80" />
      <path d="M 222 80 A 8.5 8.5 0 0 1 239 80" />
      <path d="M 239 80 A 8.5 8.5 0 0 1 256 80" />
      <path d="M 256 80 A 8.5 8.5 0 0 1 273 80" />
      <path d="M 181 80 L 205 80" />
      <path d="M 273 80 L 292 80" />
