<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" aria-labelledby="figtitle figdesc" width="660" height="320">
  <!--
    RECONSTRUCTED FIGURE - not official WBJEEB artwork.
    Source: JELET 2023 Paper I, Set A (official booklet, document JEEB/Reg-267/23),
    retrieved 2026-11-19 from the West Bengal Higher Secondary Education Council
    booklet PDF. Redrawn as original vector line art from the values and labels
    printed in the booklet. No pixel data from the official PDF is stored here.
    Standard: archive/jelet-prep/data/docs/decisions/ADR-0002-figure-reconstruction.md
    Geometry note: the printed values are C1 = 5 microfarad, C2 = 10 microfarad and a
    5 volt supply. In series the two capacitors share a charge, which gives
    V1 = 10/3 V and V2 = 5/3 V, the pair of values printed as the correct option.
  -->
  <title id="figtitle">Two capacitors in series across a five volt supply</title>
  <desc id="figdesc">A 5 volt supply at the bottom of the circuit feeds two capacitors in series along the top wire. The left capacitor is C1 with a capacitance of 5 microfarads and the voltage drop V1 across it; the right capacitor is C2 with a capacitance of 10 microfarads and the voltage drop V2 across it.</desc>
  <style>
    .fig-bg { fill: var(--fig-bg, #fffdf8); }
    .fig-lbl { fill: var(--fig-ink, #12252f); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    .fig-mut { fill: var(--fig-muted, #5d7683); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 500; }
    .fig-ln { stroke: var(--fig-ink, #12252f); fill: none; }
    .fig-acc { stroke: var(--fig-accent, #0a5c4c); fill: none; }
    .fig-accf { fill: var(--fig-accent, #0a5c4c); }
    .fig-dash { stroke: var(--fig-muted, #5d7683); fill: none; stroke-dasharray: 5 4; }
    .fig-fill { fill: var(--fig-fill, #dcefe7); stroke: var(--fig-ink, #12252f); }
    .fig-plate { fill: var(--fig-ink, #12252f); stroke: none; }
    .fig-soft { stroke: var(--fig-muted, #5d7683); fill: none; stroke-width: 1.6; }
    .fig-mask { fill: var(--fig-bg, #fffdf8); stroke: none; }
    .fig-halo { paint-order: stroke; stroke: var(--fig-bg, #fffdf8); stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <rect class="fig-bg" x="0" y="0" width="660" height="320" rx="12"/>
    <g class="fig-ln" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 110 80 L 222 80" />
      <path d="M 238 80 L 412 80" />
      <path d="M 428 80 L 550 80 L 550 250 L 338 250" />
      <path d="M 322 250 L 110 250 L 110 80" />
      <path class="fig-plate" stroke="none" d="M 218 58 L 226 58 L 226 102 L 218 102 Z" />
      <path class="fig-plate" stroke="none" d="M 234 58 L 242 58 L 242 102 L 234 102 Z" />
      <path class="fig-plate" stroke="none" d="M 408 58 L 416 58 L 416 102 L 408 102 Z" />
      <path class="fig-plate" stroke="none" d="M 424 58 L 432 58 L 432 102 L 424 102 Z" />
      <path class="fig-plate" stroke="none" d="M 318 222 L 326 222 L 326 278 L 318 278 Z" />
      <path class="fig-plate" stroke="none" d="M 334 234 L 342 234 L 342 266 L 334 266 Z" />
    </g>
      <path class="fig-soft" d="M 222 52 L 242 52 M 222 48 L 222 56 M 242 48 L 242 56" />
      <path class="fig-soft" d="M 412 52 L 432 52 M 412 48 L 412 56 M 432 48 L 432 56" />
    <text class="fig-lbl" x="232" y="34" font-size="15" text-anchor="middle">V1<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
    <text class="fig-lbl" x="422" y="34" font-size="15" text-anchor="middle">V2<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
    <text class="fig-lbl" x="232" y="132" font-size="14" text-anchor="middle">C1<tspan baseline-shift="sub" font-size="70%">1</tspan> = 5 µF</text>
    <text class="fig-lbl" x="422" y="132" font-size="14" text-anchor="middle">C2<tspan baseline-shift="sub" font-size="70%">2</tspan> = 10 µF</text>
    <text class="fig-lbl" x="330" y="296" font-size="14" text-anchor="middle">5 V</text>
</svg>
