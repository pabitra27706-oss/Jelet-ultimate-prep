<title id="fig-2022-49-title">Four candidate graphs of gravitational potential magnitude</title>
<desc id="fig-2022-49-desc">All graphs have horizontal x and vertical magnitude |V(x)| axes. A: an even trough touching zero at x=0, rising and flattening on both sides. B: an even U-shaped curve with its minimum above zero. C: an upper semicircular arch meeting the x axis on each side. D: an even bell-shaped maximum at x=0, falling and flattening toward both sides.</desc>
