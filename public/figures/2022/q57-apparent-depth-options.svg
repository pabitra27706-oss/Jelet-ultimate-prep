<title id="fig-2022-57-title">Draining liquid vessel and four apparent-depth graphs</title>
<desc id="fig-2022-57-desc">A vessel of height H holds liquid to height x above its bottom. Spot P is at the bottom, apparent image P-prime is above it, and Q marks the top reference. The downward distance from Q to the image is d. Four d-versus-x options: A: straight rise from H at x=0 to mu H at x=H. B: straight fall from H to H/mu. C: straight rise from H/mu to H. D: straight rise from zero to H. The latter three endpoints also have x=H.</desc>
