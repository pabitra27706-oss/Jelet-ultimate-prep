<title id="fig-2022-93-title">Induction motor torque-speed curve with four marked points</title>
<desc id="fig-2022-93-desc">Torque T is vertical and speed N horizontal. The curve has positive torque to the left of zero speed, rises to a positive peak, then falls through the speed axis and becomes negative. W lies left of the vertical axis at positive torque. X is on the rising positive-speed branch. Y is on the falling branch above the horizontal axis. Z is below that axis on the negative-torque portion.</desc>
