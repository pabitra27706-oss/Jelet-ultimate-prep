<title id="fig-2024-57-title">Potential energy with two peaks and a trough</title>
<desc id="fig-2024-57-desc">Potential energy V(x) is plotted vertically against position x. The smooth curve rises to a high first peak, descends to a trough above the x axis, rises to a lower second peak and then falls. No numerical ticks are shown.</desc>
