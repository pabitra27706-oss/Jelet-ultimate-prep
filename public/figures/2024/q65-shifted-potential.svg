<title id="fig-2024-65-title">Symmetric potential curve with its minimum above zero</title>
<desc id="fig-2024-65-desc">A symmetric upward-opening potential curve has its minimum on the vertical V axis, above the horizontal x axis. The minimum level is labelled V0. Both arms rise symmetrically away from x equal to zero.</desc>
