<title id="fig-2024-78-title">Four aromatic chemical structure alternatives</title>
<desc id="fig-2024-78-desc">A: benzene bonded through a CH2 link to COOH. B: benzene with OH at the top and nitro groups at both adjacent positions and the opposite bottom position. C: benzene with adjacent OH and COOH groups. D: benzene with one OH group. All rings show alternating double bonds.</desc>
