<title id="fig-2024-96-title">Two-diode network with a tapped resistor branch</title>
<desc id="fig-2024-96-desc">The left source is 10 V with its positive plate at the top; the right source is 15 V with its positive plate at the bottom. Their bottom terminals share a return wire. The top path from left to right contains D1 pointing right, a central junction, a 10 kilohm resistor, and D2 pointing left. From the central junction two series 10 kilohm resistors lead to the bottom return. V0 is tapped between those two resistors.</desc>
