<title id="fig-2024-54-title">Four hanging masses on a fixed pulley</title>
<desc id="fig-2024-54-desc">A fixed overhead pulley carries a string labelled T1 on both sides. On the left it holds a 5 kg mass, which holds a lower 10 kg mass by a string labelled T2. On the right it holds a 10 kg mass, which holds a lower 5 kg mass by a string labelled T3. All shown tension arrows point upward.</desc>
