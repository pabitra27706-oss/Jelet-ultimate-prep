<title id="fig-2024-79-title">Four hydrocarbon structural alternatives</title>
<desc id="fig-2024-79-desc">A: CH3–C≡C–CH=CH2. B: CH3–C≡C–CH2–CH3. C: CH3–CH=CH–C≡CH, shown as a bent skeletal chain with the triple bond at the open end. D: CH3–CH=C=CH–CH3. All four alternatives are retained in their printed order.</desc>
