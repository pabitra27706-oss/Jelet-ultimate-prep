<title id="fig-2024-66-title">Four velocity-displacement alternatives</title>
<desc id="fig-2024-66-desc">Each panel plots velocity V against displacement x, starting at V0 on the vertical axis. A: a gradual smooth decay remaining above the axis. B: a straight descending line reaching the x axis. C: a steep initial curved decay flattening onto the axis. D: a decaying oscillatory curve crossing below and above the axis.</desc>
