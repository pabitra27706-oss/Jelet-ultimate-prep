<title id="fig-2024-52-title">Four lens pieces before and after rearrangement</title>
<desc id="fig-2024-52-desc">An equiconvex lens is split by vertical and horizontal lines into A upper left, B upper right, C lower left and D lower right. An arrow marked Rearrangement leads to four upright pieces ordered A, B, C, D on a horizontal baseline. Each has a curved left boundary and straight right boundary.</desc>
