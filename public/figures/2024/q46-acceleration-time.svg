<title id="fig-2024-46-title">Acceleration declining linearly with time</title>
<desc id="fig-2024-46-desc">The vertical axis is acceleration a in metres per second squared; the horizontal axis is time t in seconds. A straight segment descends from acceleration 10 at time zero to acceleration zero at time 25.</desc>
