<title id="fig-2024-42-title">Projectile trajectory and four pairs of component speed graphs</title>
<desc id="fig-2024-42-desc">A projectile starts at the origin with initial speed u at angle theta above the x axis and follows a parabolic arc back to the x axis. Four options pair vx-time and vy-time graphs. A: vx constant, vy falls to zero then rises. B: vx falls to zero then rises, vy constant. C: vx constant, vy rises from zero to a peak then falls to zero. D: vx rises from zero to a peak then falls to zero, vy constant.</desc>
